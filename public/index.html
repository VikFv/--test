<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/icomoon.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header>HEADER</header>
    <content>
        <div class="content-container">
            <h1 class="product-name">NAME</h1>
            <div class="product-descr">
                <div class="product-pic">
                    <div class="product-pic-main">
                        <img src="" alt="">
                        <i class="icon-zoom-in"></i>
                    </div>
                    <div class="product-pic-preview">
                    </div>
                </div>  
                <div class="product-packaging">
                    <div class="review-favorites">
                        <div class="product-review">
                            <i class="icon-bubble"></i>
                            <p>оставить отзыв</p>
                        </div>
                        <div class="product-to-favorites">
                            <i class="icon-heart"></i>
                        </div>
                    </div>
                    <div class="product-packagings">
                    </div>
                </div>          
            </div>
        </div>
        <div class="categories">
            <div class="categories-header">
                Категории
            </div>
            <div class="catrgories-content"></div>
            <div class="catrgories-more"></div>
        </div>
    </content>
    <footer>FOOTER</footer>
    <div class="addToCartNotification"></div>

    <script src="scripts/main.js"></script>
</body>
</html>
